<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto28-Cartão de Perfil</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="cartaoperfil">
      <div class="imagem">
        <img src="img/perfil.jpg" alt="" class="perfil" />
      </div>
      <div class="info">
        <span class="nome">Augusto Silva</span>
        <span class="trabalho">YouTuber e Blogger</span>
      </div>
      <div class="redessoc">
        <a href="#" style="background: #4267b2" class="link">
          <i class="bx bxl-facebook"></i>
        </a>
        <a href="#" style="background: #1da1f2" class="link">
          <i class="bx bxl-twitter"></i>
        </a>
        <a href="#" style="background: #e1306c" class="link">
          <i class="bx bxl-instagram"></i>
        </a>
        <a href="#" style="background: #ff0000" class="link">
          <i class="bx bxl-youtube"></i>
        </a>
      </div>
      <div class="botoes">
        <button class="botao">Inscreva-se</button>
        <button class="botao">Mensagem</button>
      </div>
      <div class="analise">
        <div class="dados">
          <i class="bx bx-heart"></i>
          <span class="numero">60k</span>
        </div>
        <div class="dados">
          <i class="bx bx-message-rounded"></i>
          <span class="number">20k</span>
        </div>
        <div class="dados">
          <i class="bx bx-share"></i>
          <span class="numero">12k</span>
        </div>
      </div>
    </div>
  </body>
</html>
